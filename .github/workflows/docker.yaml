name: Docker (skopeo)

# 与 docker-mirror.yml 等价，但用 skopeo 直接 registry -> registry 流式复制：
# 本地不落地镜像层，根分区和 /var/lib/docker 都不会被撑爆，
# 不需要 maximize-build-space、不需要 docker rmi 回收。
#
# 注意 ACR 兼容性：buildkit 构建的镜像 index 里会带一条 provenance attestation
# （platform = unknown/unknown，config mediaType = application/vnd.oci.empty.v1+json），
# 阿里云 ACR 不认识这类 OCI 1.1 artifact，会报
#   denied: unknown manifest class for application/vnd.oci.empty.v1+json
# 所以这里统一用 --format v2s2 转成 Docker manifest list，并准备了退化路径。

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

concurrency:
  group: docker-sync-skopeo-${{ github.ref }}
  cancel-in-progress: false

jobs:

  mirror:
    name: skopeo ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [ 0, 1, 2, 3 ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install skopeo
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq skopeo jq

    - name: Pick shard
      run: |
        mkdir -p work
        awk -v n=${{ matrix.shard }} -v t=${{ strategy.job-total }} '
          /^[[:space:]]*#/ { next }
          /^[[:space:]]*$/ { next }
          { if (c++ % t == n) print }
        ' images.txt > work/batch.txt
        echo "本分片 ${{ matrix.shard }} 条数: $(wc -l < work/batch.txt)"

    - name: Copy images
      shell: bash
      run: |
        set -uo pipefail

        REG="$ALIYUN_REGISTRY"
        DEST_NS="$ALIYUN_NAME_SPACE"
        : > work/failed.txt

        echo "$ALIYUN_REGISTRY_PASSWORD" \
          | skopeo login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$REG"

        # 全量重名检测（跨分片必须一致，所以扫完整 images.txt）
        declare -A seen=() dup=()
        while IFS= read -r raw; do
          line="${raw%%#*}"
          read -r -a p <<< "$line" || true
          [ "${#p[@]}" -eq 0 ] && continue
          img="${p[-1]%%@*}"
          if [[ "$img" == */* ]]; then s="${img##*/}"; ns="${img%/*}"; ns="${ns##*/}"; else s="$img"; ns=""; fi
          nm="${s%%:*}"
          if [ -z "${seen[$nm]:-}" ]; then
            seen[$nm]="$ns"
          elif [ "${seen[$nm]}" != "$ns" ]; then
            dup[$nm]=1
          fi
        done < images.txt

        # 单次复制：失败信息落盘，便于事后定位
        do_copy() {
          local src="$1" dst="$2"; shift 2
          skopeo copy --retry-times 3 "$@" "docker://$src" "docker://$dst" > /dev/null 2> work/last_err.txt
        }

        ok=0; bad=0; n=0
        while IFS= read -r line; do
          read -r -a p <<< "$line" || true
          [ "${#p[@]}" -eq 0 ] && continue
          n=$((n + 1))

          src="${p[-1]}"
          platform=""
          for ((k = 0; k < ${#p[@]} - 1; k++)); do
            case "${p[k]}" in
              --platform=*) platform="${p[k]#--platform=}" ;;
              --platform)   platform="${p[k + 1]}" ;;
            esac
          done

          img="${src%%@*}"
          if [[ "$img" == */* ]]; then
            suffix="${img##*/}"
            ns="${img%/*}"
            ns="${ns##*/}"
          else
            suffix="$img"
            ns=""
          fi
          nm="${suffix%%:*}"

          ns_prefix=""
          [ -n "${dup[$nm]:-}" ] && [ -n "$ns" ] && ns_prefix="${ns}_"
          plat_prefix=""
          [ -n "$platform" ] && plat_prefix="${platform//\//_}_"

          dst="$REG/$DEST_NS/${plat_prefix}${ns_prefix}${suffix}"

          if [ -n "$platform" ]; then
            # images.txt 明确指定了架构：单架构复制，v2s2 保证 ACR 兼容
            if do_copy "$src" "$dst" --format v2s2 \
                 --override-os "${platform%%/*}" --override-arch "${platform##*/}"; then
              ok=$((ok + 1))
            else
              bad=$((bad + 1))
              echo "::warning::失败 $src -> $dst : $(tail -n 1 work/last_err.txt)"
              echo "$src" >> work/failed.txt
            fi
          else
            # 未指定架构：原图可能是多架构 index，且常带 buildkit 的 attestation
            # 1) --format v2s2 --all：转 Docker manifest list，规避 OCI empty artifact
            # 2) 退回 --all 原样复制
            # 3) 再退回 linux/amd64 单架构（等于原 docker pull/push 版本的行为）
            if do_copy "$src" "$dst" --format v2s2 --all; then
              ok=$((ok + 1))
            elif do_copy "$src" "$dst" --all; then
              ok=$((ok + 1))
            else
              echo "::warning::$src 多架构复制失败，退化为 linux/amd64"
              if do_copy "$src" "$dst" --format v2s2 --override-os linux --override-arch amd64; then
                ok=$((ok + 1))
              else
                bad=$((bad + 1))
                echo "::warning::失败 $src -> $dst : $(tail -n 1 work/last_err.txt)"
                echo "$src" >> work/failed.txt
              fi
            fi
          fi

          if [ $((n % 10)) -eq 0 ]; then
            echo "[$n] ok=$ok bad=$bad root_free=$(df -Pm / | awk 'NR == 2 { print $4 }')MB"
          fi
        done < work/batch.txt

        echo "本分片完成: ok=$ok bad=$bad"
        if [ -s work/failed.txt ]; then
          echo "::error::失败清单已随 artifacts 上传（failed-${{ matrix.shard }}）"
          cat work/failed.txt
        fi
        [ "$bad" -eq 0 ]

    - name: Upload failed list
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: failed-${{ matrix.shard }}
        path: work/failed.txt
        if-no-files-found: ignore
