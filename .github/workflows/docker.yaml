name: Docker (skopeo)

# 与 docker-mirror.yml 等价，但用 skopeo 直接 registry -> registry 流式复制：
# 本地不落地镜像层，根分区和 /var/lib/docker 都不会被撑爆，
# 不需要 maximize-build-space、不需要 docker rmi 回收、也不需要分片护栏。
# 代价：不能再靠 docker tag 做本地加工，命名规则必须在 skopeo 的目标引用里一次拼对。

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

concurrency:
  group: docker-sync-skopeo-${{ github.ref }}
  cancel-in-progress: false

jobs:

  mirror:
    name: skopeo ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [ 0, 1, 2, 3 ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install skopeo
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq skopeo

    - name: Pick shard
      run: |
        mkdir -p work
        awk -v n=${{ matrix.shard }} -v t=${{ strategy.job-total }} '
          /^[[:space:]]*#/ { next }
          /^[[:space:]]*$/ { next }
          { if (c++ % t == n) print }
        ' images.txt > work/batch.txt
        echo "本分片 ${{ matrix.shard }} 条数: $(wc -l < work/batch.txt)"

    - name: Copy images
      shell: bash
      run: |
        set -uo pipefail

        echo "$ALIYUN_REGISTRY_PASSWORD" \
          | skopeo login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

        # 全量重名检测（跨分片必须一致，所以扫完整 images.txt）
        declare -A seen=() dup=()
        while IFS= read -r raw; do
          line="${raw%%#*}"
          read -r -a p <<< "$line" || true
          [ "${#p[@]}" -eq 0 ] && continue
          img="${p[-1]%%@*}"
          if [[ "$img" == */* ]]; then s="${img##*/}"; ns="${img%/*}"; ns="${ns##*/}"; else s="$img"; ns=""; fi
          nm="${s%%:*}"
          if [ -z "${seen[$nm]:-}" ]; then
            seen[$nm]="$ns"
          elif [ "${seen[$nm]}" != "$ns" ]; then
            dup[$nm]=1
          fi
        done < images.txt

        ok=0; bad=0; n=0
        while IFS= read -r line; do
          read -r -a p <<< "$line" || true
          [ "${#p[@]}" -eq 0 ] && continue
          n=$((n + 1))

          src="${p[-1]}"
          platform=""
          for ((k = 0; k < ${#p[@]} - 1; k++)); do
            case "${p[k]}" in
              --platform=*) platform="${p[k]#--platform=}" ;;
              --platform)   platform="${p[k + 1]}" ;;
            esac
          done

          img="${src%%@*}"
          if [[ "$img" == */* ]]; then
            suffix="${img##*/}"
            ns="${img%/*}"
            ns="${ns##*/}"
          else
            suffix="$img"
            ns=""
          fi
          nm="${suffix%%:*}"

          ns_prefix=""
          [ -n "${dup[$nm]:-}" ] && [ -n "$ns" ] && ns_prefix="${ns}_"
          plat_prefix=""
          [ -n "$platform" ] && plat_prefix="${platform//\//_}_"

          dst="docker://$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${plat_prefix}${ns_prefix}${suffix}"

          # 指定了 --platform 就单架构复制；没指定则 --all 复制整个 manifest list（比原版只拉当前架构更完整）
          if [ -n "$platform" ]; then
            args=(--override-os "${platform%%/*}" --override-arch "${platform##*/}")
          else
            args=(--all)
          fi

          if skopeo copy --retry-times 3 "${args[@]}" "docker://$src" "$dst" > /dev/null; then
            ok=$((ok + 1))
          else
            bad=$((bad + 1))
            echo "::warning::失败 $src"
          fi

          if [ $((n % 10)) -eq 0 ]; then
            echo "[$n] ok=$ok bad=$bad root_free=$(df -Pm / | awk 'NR == 2 { print $4 }')MB"
          fi
        done < work/batch.txt

        echo "本分片完成: ok=$ok bad=$bad"
        [ "$bad" -eq 0 ]
